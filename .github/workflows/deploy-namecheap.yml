name: Deploy static site to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: namecheap-production-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and upload site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify Namecheap deployment secrets
        run: |
          missing=0
          for secret_name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not set. Add it in GitHub Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload static export to Namecheap over FTP
        run: |
          port="${FTP_PORT:-21}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$port" "ftp://$FTP_SERVER" <<EOF
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-allow true
          set ftp:passive-mode true
          mirror --reverse --verbose --parallel=2 ./out/ "$FTP_SERVER_DIR"
          bye
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
