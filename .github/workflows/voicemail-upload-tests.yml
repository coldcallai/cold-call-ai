name: Voicemail MP3 upload tests

on:
  push:
    branches:
      - intentbrain-voicemail-mp3-upload-20260924
  pull_request:
    branches:
      - intentbrain-server-sync-20260826

jobs:
  voicemail-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'fastapi==0.110.1' 'starlette==0.37.2' 'motor==3.3.1' 'pymongo==4.5.0' 'python-dotenv' 'python-multipart' 'pytest' 'pytest-asyncio' 'mongomock-motor'
      - name: Check Python source syntax
        run: |
          python -m py_compile backend/routes/voicemail_upload.py backend/services/vm_cloned_audio.py backend/routes/campaigns.py backend/tests/test_voicemail_upload.py
          python -m py_compile backend/server.py
      - name: Run focused voicemail upload tests
        run: |
          python -m pytest -q backend/tests/test_voicemail_upload.py
